name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COVERAGE_THRESHOLD: 80

jobs:
  coverage:
    name: Collect coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --lib --lcov -- --test-threads=1 > lcov.info

      - name: Check coverage threshold
        run: |
          COV=$(cargo llvm-cov --lib --summary-only -- --test-threads=1 2>&1 | grep TOTAL | awk '{print $NF}' | tr -d '%')
          if (( $(echo "$COV < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Coverage $COV% below $COVERAGE_THRESHOLD% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          format: lcov
          files: lcov.info
          fail_ci_if_error: false
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
